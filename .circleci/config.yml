version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.9 /usr/local/share/virtualenvs/tap-harvest-forecast
            source /usr/local/share/virtualenvs/tap-harvest-forecast/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_harvest_forecast/schemas/*.json
      - run:
          name: 'Unit Tests + Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-harvest-forecast/bin/activate
            python -m unittest discover -s tests -v

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
